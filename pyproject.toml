[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extraction-engine"
version = "0.1.0"
description = "High-throughput document extraction API with Pydantic math validation, background workers, and a human review queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Logan Lapierre" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "httpx>=0.27.0",
  "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
pdf = [
  "pypdf>=5.1.0",
  "pillow>=11.0.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
